version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ${APP_NAME}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./backups/db:/backups
    networks:
      - wordpress_network
    command: --default-authentication-plugin=mysql_native_password

  # WordPress with WooCommerce
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: ${APP_NAME}_wordpress
    restart: unless-stopped
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}:${DB_PORT}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', ${WORDPRESS_DEBUG_LOG});
        define('WP_DEBUG_DISPLAY', ${WORDPRESS_DEBUG_DISPLAY});
        define('WP_MEMORY_LIMIT', '${WP_MEMORY_LIMIT}');
        define('WP_MAX_MEMORY_LIMIT', '${WP_MAX_MEMORY_LIMIT}');
        define('WP_HOME', '${APP_URL}');
        define('WP_SITEURL', '${APP_URL}');
        
        /* Redis Configuration */
        if (${REDIS_HOST} !== '') {
          define('WP_REDIS_HOST', '${REDIS_HOST}');
          define('WP_REDIS_PORT', ${REDIS_PORT});
        }
        
        /* Email Configuration */
        define('SMTP_HOST', '${SMTP_HOST}');
        define('SMTP_PORT', ${SMTP_PORT});
        define('SMTP_USER', '${SMTP_USER}');
        define('SMTP_PASS', '${SMTP_PASSWORD}');
        define('SMTP_FROM', '${SMTP_FROM_EMAIL}');
        define('SMTP_NAME', '${SMTP_FROM_NAME}');
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./backups/files:/backups
    networks:
      - wordpress_network

  # phpMyAdmin
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${APP_NAME}_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    networks:
      - wordpress_network

  # Redis for caching (optional but recommended for WooCommerce)
  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - wordpress_network
    command: redis-server ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${APP_NAME}_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"  # SMTP
      - "${MAILHOG_WEB_PORT}:8025"  # Web UI
    networks:
      - wordpress_network

volumes:
  db_data:
  wordpress_data:
  redis_data:

networks:
  wordpress_network:
    driver: bridge 