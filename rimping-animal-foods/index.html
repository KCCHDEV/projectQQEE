<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rimping-Animal-Foods</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Currency and Language Bar -->
    <div class="top-bar">
        <span>Currency switcher not available</span>
        <span>Translator not available</span>
    </div>

    <!-- Header -->
    <header class="main-header">
        <div class="header-container">
            <div class="site-title">
                <h1>Rimping-Animal-Foods</h1>
            </div>
            
            <div class="header-right">
                <a href="#" class="header-link">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
                <a href="#" class="header-link cart-link">
                    <span class="cart-count">0</span>
                    <i class="fas fa-shopping-cart"></i> Shopping Cart
                </a>
                <a href="#" class="header-link">
                    <i class="far fa-heart"></i> Wishlist
                </a>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="category-dropdown">
                <button class="category-btn">
                    <i class="fas fa-bars"></i> Select Category <i class="fas fa-chevron-down"></i>
                </button>
            </div>
            
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">SHOP</a></li>
                <li><a href="#" class="nav-link">CART</a></li>
                <li><a href="#" class="nav-link">CHECKOUT</a></li>
                <li><a href="#" class="nav-link">MY ACCOUNT</a></li>
            </ul>
            
            <div class="search-box">
                <input type="text" placeholder="Search products..." class="search-input">
                <button class="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h2 class="hero-title">Shop</h2>
        </div>
    </section>

    <!-- Categories Section -->
    <section class="categories-section">
        <div class="categories-container">
            <div class="search-bar-bottom">
                <input type="text" placeholder="Search" class="bottom-search">
                <i class="fas fa-search"></i>
            </div>
            
            <div class="categories-header">
                <h3>CATEGORIES</h3>
            </div>
            
            <div class="categories-grid">
                <div class="category-item">
                    <i class="fas fa-dog"></i>
                    <span>Dogs</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-cat"></i>
                    <span>Cats</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-dove"></i>
                    <span>Birds</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-fish"></i>
                    <span>Fish</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-horse"></i>
                    <span>Horses</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-box"></i>
                    <span>Supplies</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-bone"></i>
                    <span>Treats</span>
                </div>
                <div class="category-item">
                    <i class="fas fa-paw"></i>
                    <span>All Pets</span>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
